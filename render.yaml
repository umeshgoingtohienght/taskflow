# Render Blueprint — deploys the TaskFlow API.
# Render dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: taskflow-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: JWT_SECRET
        generateValue: true
      - key: MONGO_URI
        sync: false # paste your MongoDB Atlas connection string in the dashboard
      - key: CLIENT_URL
        sync: false # your Vercel URL, e.g. https://taskflow-yourname.vercel.app
